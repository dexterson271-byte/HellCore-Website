<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Tournament - {{ title }}</title>
  <style>
    :root{--bg:#08090b;--panel:#111319;--panel2:#171a22;--line:#2a2f3a;--text:#f7f7fb;--muted:#a5adbb;--accent:#ff5a2f;--bad:#ff5f67}
    *{box-sizing:border-box}body{margin:0;background:#08090b;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}main{width:min(1280px,100%);margin:0 auto;padding:26px 18px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:900}.brand img{width:40px;height:40px;border-radius:8px;object-fit:cover}h1{font-size:40px;margin:0}.muted{color:var(--muted)}
    .nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;text-decoration:none;font-weight:800;cursor:pointer}.btn.hot{background:linear-gradient(135deg,var(--accent),#e2355b);border-color:transparent}.btn.danger{color:#ffd1d4;border-color:rgba(255,95,103,.4)}
    .toolbar,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}.toolbar{display:grid;grid-template-columns:minmax(220px,460px) auto 1fr;align-items:center;gap:10px;padding:14px;margin:16px 0}.card{padding:16px;margin:12px 0}.team-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.team-head h2{margin:0 0 5px}.pill{display:inline-flex;align-items:center;min-height:24px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;text-transform:uppercase}.member{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:10px;align-items:center;border-top:1px solid rgba(255,255,255,.08);padding:10px 0}.member:first-of-type{margin-top:10px}input{width:100%;background:#0b0d12;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;outline:none}input:focus{border-color:#59667c}pre{white-space:pre-wrap;background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px;color:#dce3ef}.empty{padding:18px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
    @media(max-width:900px){.topbar{align-items:flex-start;flex-direction:column}h1{font-size:30px}.toolbar{grid-template-columns:1fr}.member{grid-template-columns:1fr}.nav a,.btn{flex:1 1 auto}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/logo.png" alt=""><span>HELLCORE</span></a>
    <div>
      <div class="muted">Tournament Admin</div>
      <h1>{{ title }}</h1>
    </div>
  </header>
  <nav class="nav">
    <a href="/staff/tournament">Teams</a>
    <a href="/staff/tournament/logs">Logs</a>
    <a href="/api/staff/tournament/export?format=csv">Export CSV</a>
    <a href="/api/staff/tournament/export?format=json">Export JSON</a>
    <a href="/tournament/teams">Public Page</a>
  </nav>
  <div class="toolbar">
    <input id="q" placeholder="Search team, user, Discord, IGN">
    <div class="actions">
      <button class="btn hot" onclick="loadTeams()">Search</button>
      <button id="toggleReg" class="btn" onclick="toggleRegistration()">Toggle Registration</button>
    </div>
    <span id="settings" class="muted"></span>
  </div>
  <section id="teams"></section>
  <section id="logs" {% if page != 'logs' %}style="display:none"{% endif %}></section>
</main>
<script>
const PAGE={{ page|tojson }};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let SETTINGS={};
async function api(url,opt={}){const r=await fetch(url,{method:opt.method||'GET',credentials:'include',headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});const d=await r.json().catch(()=>({error:'Request failed'}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function loadTeams(){
  const p=new URLSearchParams();if($('q').value.trim())p.set('q',$('q').value.trim());
  const d=await api('/api/staff/tournament/teams?'+p);SETTINGS=d.settings;$('settings').textContent=`Registration: ${SETTINGS.registration_open?'Open':'Closed'} - Team size ${SETTINGS.team_size} - Max ${SETTINGS.max_teams}`;
  $('teams').innerHTML=d.teams.map(t=>`
    <article class="card">
      <div class="team-head">
        <div><h2>${esc(t.team_name)}</h2><span class="pill">${esc(t.status)}</span> <span class="muted">${t.player_count}/${t.team_size} players - Invite: ${esc(t.invite_url)}</span></div>
        <div class="actions">
          <button class="btn" onclick="renameTeam(${t.id}, '${esc(t.team_name)}')">Rename</button>
          <button class="btn" onclick="confirmTeam(${t.id})">Confirm</button>
          <button class="btn danger" onclick="deleteTeam(${t.id})">Delete</button>
        </div>
      </div>
      <h3>Players</h3>
      ${t.members.map(m=>`<div class="member">
        <div><b>${esc(m.minecraft_ign)}</b><div class="muted">${esc(m.role)} - ${esc(m.rbw_source)}</div></div>
        <div>${esc(m.website_username)}<div class="muted">User ID ${esc(m.user_id)}</div></div>
        <div>${esc(m.discord_username || m.discord_global_name || '-')}<div class="muted">${esc(m.discord_id)}</div></div>
        <button class="btn danger" onclick="removeMember(${m.id})">Remove</button>
      </div>`).join('') || '<div class="empty">No players on this team.</div>'}
    </article>`).join('') || '<div class="empty">No teams yet.</div>';
}
async function renameTeam(id,name){const n=prompt('New team name',name);if(!n)return;try{await api(`/api/staff/tournament/teams/${id}/rename`,{method:'POST',body:{team_name:n}});loadTeams();}catch(e){alert(e.message)}}
async function confirmTeam(id){try{await api(`/api/staff/tournament/teams/${id}/confirm`,{method:'POST'});loadTeams();}catch(e){alert(e.message)}}
async function deleteTeam(id){if(!confirm('Delete team?'))return;try{await api(`/api/staff/tournament/teams/${id}`,{method:'DELETE'});loadTeams();}catch(e){alert(e.message)}}
async function removeMember(id){if(!confirm('Remove player?'))return;try{await api(`/api/staff/tournament/members/${id}`,{method:'DELETE'});loadTeams();}catch(e){alert(e.message)}}
async function toggleRegistration(){try{await api('/api/staff/tournament/settings',{method:'POST',body:{registration_open:!SETTINGS.registration_open}});loadTeams();}catch(e){alert(e.message)}}
async function loadLogs(){const d=await api('/api/staff/tournament/logs');$('logs').innerHTML='<h2>Logs</h2>'+d.map(l=>`<div class="card"><b>${esc(l.action_type)}</b> <span class="muted">${esc(l.created_at)}</span><div>User: ${esc(l.user_name||'-')} - Staff: ${esc(l.staff_name||'-')} - Team: ${esc(l.team_name||'-')}</div><pre>${esc(JSON.stringify(l.details,null,2))}</pre></div>`).join('') || '<div class="empty">No logs yet.</div>'}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')loadTeams()});loadTeams();if(PAGE==='logs')loadLogs();
</script>
</body>
</html>
