<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registered Teams - {{ title }}</title>
  <style>
    :root{--bg:#050505;--panel:#121214;--line:#2d2d34;--text:#fff;--muted:#a1a1aa;--accent:#ff512f;--good:#35d07f;--warn:#f5b84b}
    *{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:Inter,Arial,sans-serif}main{max-width:1180px;margin:0 auto;padding:30px 18px 60px}h1{font-size:clamp(30px,5vw,54px);margin:0 0 8px}.top{padding:24px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,rgba(255,81,47,.15),rgba(255,255,255,.03)),var(--panel)}p{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin:18px 0}input,select,.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font:inherit}.btn{background:var(--accent);font-weight:800;text-decoration:none;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px}.status{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:800}.complete,.confirmed{color:var(--good)}.incomplete{color:var(--warn)}.member{display:flex;gap:8px;align-items:center;margin:8px 0}.member img{width:26px;height:26px;border-radius:4px;image-rendering:pixelated}.muted{color:var(--muted)}@media(max-width:720px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="top">
    <p style="color:var(--accent);font-weight:900;margin:0">31 May 2026 · 4v4 RBW · Double Elimination</p>
    <h1>Registered Teams</h1>
    <p id="summary">Loading...</p>
    <div id="registerAction"></div>
  </section>
  <div class="controls">
    <input id="q" placeholder="Search team or Minecraft IGN">
    <select id="status">
      <option value="all">All teams</option>
      <option value="complete">Complete teams</option>
      <option value="incomplete">Incomplete teams</option>
    </select>
    <button class="btn" onclick="loadTeams()">Search</button>
  </div>
  <div id="teams" class="grid"></div>
</main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadTeams(){
  const p=new URLSearchParams(); if($('q').value.trim())p.set('q',$('q').value.trim()); p.set('status',$('status').value);
  const res=await fetch('/api/tournament/teams?'+p); const d=await res.json();
  $('summary').textContent=`Registered Teams: ${d.registered_teams}/${d.max_teams}`;
  $('registerAction').innerHTML=d.registration_open?'<a class="btn" href="/tournament/create">Register Your Team</a>':'<p>Registration is currently closed.</p>';
  if(!d.teams.length){$('teams').innerHTML='<p>No teams have registered yet.</p>';return;}
  $('teams').innerHTML=d.teams.map(t=>`
    <article class="card">
      <h2>${esc(t.team_name)}</h2>
      <div><span class="status ${esc(t.status)}">${esc(t.status)}</span> <span class="muted">${t.player_count}/${t.team_size} Players</span></div>
      <p><b>Captain:</b> ${esc(t.captain || 'TBD')}</p>
      ${t.members.map(m=>`<div class="member"><img src="/api/skin/head/${encodeURIComponent(m.minecraft_ign)}/26"><span>${esc(m.minecraft_ign)}</span><span class="muted">${m.role==='captain'?'Captain':''}</span></div>`).join('')}
    </article>`).join('');
}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')loadTeams()});$('status').addEventListener('change',loadTeams);loadTeams();
</script>
</body>
</html>
